e1b4b" opacity=".25"/><text transform="translate(441.0,193.0) rotate(-90)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e1b4b">Aftertaste</text></g><g><rect x="473" y="114" width="56" height="182" rx="4" fill="#f59e0b"/><rect x="473" y="128" width="56" height="4" fill="#1e1b4b" opacity=".25"/><rect x="473" y="276" width="56" height="4" fill="#1e1b4b" opacity=".25"/><text transform="translate(506.0,205.0) rotate(-90)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e1b4b">Upcycle AI</text><g class="wip"><path d="M501.0,116 l0,14" stroke="#fde68a"/><rect x="484.0" y="130" width="34" height="16" rx="3" fill="#fde68a"/><text x="501.0" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#78350f">WIP</text></g></g><g><rect x="534" y="98" width="60" height="198" rx="4" fill="#14b8a6"/><rect x="534" y="112" width="60" height="4" fill="#1e1b4b" opacity=".25"/><rect x="534" y="276" width="60" height="4" fill="#1e1b4b" opacity=".25"/><text transform="translate(569.0,197.0) rotate(-90)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e1b4b">Idle Hands</text></g><g><rect x="599" y="106" width="58" height="190" rx="4" fill="#6366f1"/><rect x="599" y="120" width="58" height="4" fill="#f8fafc" opacity=".25"/><rect x="599" y="276" width="58" height="4" fill="#f8fafc" opacity=".25"/><text transform="translate(633.0,201.0) rotate(-90)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Hey Ollie</text></g><g><rect x="662" y="120" width="54" height="176" rx="4" fill="#e11d48"/><rect x="662" y="134" width="54"