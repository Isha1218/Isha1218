<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="A bookshelf of Ishita's projects, with a penguin reading at the end."><title>A bookshelf of Ishita's projects, with a penguin reading at the end.</title><style>
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.twinkle{animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.9}}
.page{transform-box:fill-box;transform-origin:0% 50%;animation:flip 3.2s ease-in-out infinite}
@keyframes flip{0%,70%{transform:scaleX(1)}85%{transform:scaleX(0)}100%{transform:scaleX(-1)}}
.heart{animation:rise 2.4s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}

.pickme{animation:pick 6s ease-in-out infinite}@keyframes pick{0%,70%,100%{transform:translateY(0)}78%,90%{transform:translateY(-14px)}}
.wip{animation:tick 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes tick{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.leaf{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
</style><defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1230"/>
<stop offset="1" stop-color="#1f2a5a"/></linearGradient><clipPath id="frame"><rect width="900" height="340" rx="18"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="900" height="340" fill="url(#wall)"/>
<text x="36" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#a5b4fc">THE ICEBERG LIBRARY</text>
<text x="36" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#cbd5e1">things i've built, shelved by vibe</text>
